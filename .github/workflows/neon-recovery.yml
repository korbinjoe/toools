name: Neon recovery and publication

on:
  schedule:
    # UTC: first attempt is 2026-11-01 08:07 in Asia/Shanghai.
    # The year and exact recovery window are also enforced by the entrypoint.
    - cron: '7,22,37,52 * 1-3 11 *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Preflight checks credentials without changing production. Recover is time-gated.'
        required: true
        default: preflight
        type: choice
        options:
          - preflight
          - recover

permissions:
  contents: read
  issues: write
  actions: write

concurrency:
  group: toools-neon-recovery-2026-11
  cancel-in-progress: false

jobs:
  recover:
    if: github.repository == 'korbinjoe/toools' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Select recovery mode and schedule window
        id: invocation
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_MODE: ${{ inputs.mode || 'preflight' }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const scheduled = process.env.EVENT_NAME === 'schedule';
          const now = Date.now();
          const inWindow = now >= Date.parse('2026-11-01T00:00:00Z') &&
            now < Date.parse('2026-11-04T00:00:00Z');
          const run = !scheduled || inWindow;
          const mode = scheduled ? 'recover' : process.env.REQUESTED_MODE;
          if (!['preflight', 'recover'].includes(mode)) throw new Error('Invalid recovery mode');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `run=${run}\nmode=${mode}\n`);
          if (!run) console.log('Scheduled recovery is outside its 2026 recovery window; skipped.');
          NODE

      - name: Check out trusted production commit
        if: steps.invocation.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        if: steps.invocation.outputs.run == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install locked dependencies
        if: steps.invocation.outputs.run == 'true'
        run: npm ci --no-audit --no-fund

      - name: Run cloud recovery entrypoint
        if: steps.invocation.outputs.run == 'true'
        env:
          RECOVERY_MODE: ${{ steps.invocation.outputs.mode }}
          CLOUD_NEON_API_KEY: ${{ secrets.CLOUD_NEON_API_KEY }}
          CLOUD_VERCEL_TOKEN: ${{ secrets.CLOUD_VERCEL_TOKEN }}
          CLOUD_DATABASE_TEMPLATE: ${{ secrets.CLOUD_DATABASE_TEMPLATE }}
          REVALIDATION_SECRET: ${{ secrets.REVALIDATION_SECRET }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          GITHUB_TOKEN: ${{ github.token }}
          # GITHUB_SHA and GITHUB_REPOSITORY are provided by the Actions runner.
        run: npm run recovery:cloud -- --mode "$RECOVERY_MODE"

      - name: Reclaim only this run's temporary validation branch
        if: always() && steps.invocation.outputs.run == 'true' && steps.invocation.outputs.mode == 'recover'
        env:
          CLOUD_NEON_API_KEY: ${{ secrets.CLOUD_NEON_API_KEY }}
        run: npm run recovery:cloud -- --cleanup
